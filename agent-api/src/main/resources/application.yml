# ============================================================
# 应用主配置入口
# ------------------------------------------------------------
# 设计原则：
#   1. 本文件只放"顶层声明"和"配置导入"——不放具体配置项
#   2. 具体配置按业务域拆分到 config/ 目录下的子文件
#   3. 加载顺序 = import 声明顺序——后面的覆盖前面的
# ============================================================

server:
  port: 8080
  servlet:
    # 全局路径前缀——所有接口都是 /fap/xxx
    context-path: /fap
    session:
      # Session 超时（秒）——86400 = 24 小时
      timeout: 86400

spring:
  config:
    # 导入各业务域配置文件
    # 顺序：基础设施 → 应用模块 → 可观测性
    import:
      - classpath:config/spring-infra.yml
      - classpath:config/app-rag.yml
      - classpath:config/app-memory.yml
      - classpath:config/app-workflow.yml
      - classpath:config/app-plan.yml
      - classpath:config/app-observability.yml