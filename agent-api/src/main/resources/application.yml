server:
  port: 8080
  servlet:
    context-path: /fap
    session:
      timeout: 86400

spring:
  # ========== 排除不需要的 OpenAI 自动配置 ==========
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    openai:
      # ========== Chat 模型（DeepSeek）==========
      chat:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY}
        options:
          model: deepseek-v4-pro

      # ========== Embedding 模型（阿里云百炼）==========
      embedding:
        # 用控制台显示的专属域名
        base-url: https://llm-flmgbipyi282dygn.cn-beijing.maas.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY}
        options:
          model: text-embedding-v4
          dimensions: 1024

    # ========== Qdrant 向量库 ==========
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: agent-rag
        initialize-schema: true
        use-tls: false
        check-compatibility: false         # ← 别忘加这行

  datasource:
    url: "jdbc:mysql://${MYSQL_HOST}:3306/rag?useUnicode=true&autoReconnect=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      database: 0
      port: 6379
      password: hfcx_redis_123456

# ↓ mybatis 顶格，与 spring 平级
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.example.rag.entity
#  configuration:
#    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.web.client: TRACE          # ← DEBUG 改成 TRACE
    org.springframework.web.client.DefaultRestClient: TRACE
    org.springframework.http.client: TRACE
    org.springframework.ai.openai: DEBUG
    org.mybatis: DEBUG
    org.mybatis.spring: DEBUG
    org.apache.ibatis: DEBUG

app:
  rag:
    ingest:                            # ★ 摄取配置
      file-storage-dir: D:/DevelopmentTool/qdrant/rag-files/
      listen-files-dir: D:/download/testVectorData
      scan-interval-ms: 300000
      incremental-enabled: true
    retrieval:                         # ★ 检索配置
      top-k: 2
      similarity-threshold: 0.5
      rrf-k: 60
      recall-multiplier: 2
      rerank:
        api-url: http://localhost:8081/rerank
        timeout-seconds: 8
        min-score: 0.3
      fusion-strategy: weighted
      vector-weight: 0.7
      keyword-weight: 0.3

  # ★ D45 新增：OCR 配置
  ocr:
    enabled: true                          # 关闭后跳过所有 OCR，图片入库会返回空
    tessdata-path: ./tessdata/             # 语言包目录
    language: chi_sim+eng                  # 中文简体 + 英文
    timeout-seconds: 30                    # 单张图 OCR 超时
    min-text-length: 5                     # 少于 5 字视为无有效文本
    page-seg-mode: 3                       # PSM 3 = 全自动

  #D47澄清判定配置
  clarification:
    enabled: true
    min-top-score: 0.5
    min-qualified-docs: 2

  #D50 新增：对话历史向量化
  conversation-memory:
    enabled: true
    index-name: conversation-memory-index
    key-prefix: "conv-mem:"
    top-k: 3
    similarity-threshold: 0.75
    max-assistant-chars: 2000
    min-user-message-chars: 5
    exclude-current-conversation: true
    # ★ D54：SCAN 查询配置
    scan-batch-size: 500
    scan-timeout-seconds: 5
    max-conversation-ids: 1000

  #D51个性化检索逻辑开关
  retrieval:
    profile:
      enabled: true     # 灰度上线，观察后再全量

  #缓存模块配置
  cache:
    semantic:
      enabled: true
      index-name: semantic-cache-index
      key-prefix: "semantic-cache:"
      similarity-threshold: 0.85
      ttl-hours: 24
      max-cache-per-user: 200

  # ★ D52 新增：主动推荐
  recommendation:
    enabled: true
    top-k: 3
    recall-size: 9
    recent-query-count: 2
    prefix: "[RECOMMEND]"
    max-snippet-chars: 80

  # ★ D53：用户兴趣标签
  user-interest:
    enabled: true
    inject-top-n: 5
    max-tags-per-user: 30
    ttl-days: 180
    weight-increment: 0.15
    max-weight: 1.0
    min-weight: 0.2

  # ★ D55：异步索引
  async-index:
    enabled: true
    concurrency: 4                # 4 个文件并发
    queue-capacity: 500           # 背压队列
    per-file-timeout-seconds: 300 # 单文件 5 分钟
    min-interval-ms: 200          # 文件间最小间隔——防 API 429
    progress-log-interval: 10     # 每 10 个文件打一次进度



  compaction:
    max-messages-before-compaction: 20  #应为配置文件里配置 20 条就开始压缩了（默认 100，本项目 yml 覆盖为 20——便于演示）
    keep-recent-messages: 8