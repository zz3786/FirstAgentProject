# ============================================================
# 服务器配置
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /fap
    session:
      timeout: 86400

# ============================================================
# Spring 核心配置
# ============================================================
spring:
  # ========== 排除不需要的 OpenAI 自动配置 ==========
  # 本项目只用 Chat 和 Embedding，不需要 Audio/Image/Moderation
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  ai:
    openai:
      # ========== Chat 模型（DeepSeek）==========
      chat:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY}
        options:
          model: deepseek-v4-pro

      # ========== Embedding 模型（阿里云百炼）==========
      embedding:
        base-url: https://llm-flmgbipyi282dygn.cn-beijing.maas.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY}
        options:
          model: text-embedding-v4
          dimensions: 1024

    # ========== Qdrant 向量库 ==========
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: agent-rag
        initialize-schema: true
        use-tls: false
        check-compatibility: false

  datasource:
    url: "jdbc:mysql://${MYSQL_HOST}:3306/rag?useUnicode=true&autoReconnect=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      database: 0
      port: 6379
      password: hfcx_redis_123456

# ============================================================
# MyBatis
# ============================================================
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  # ⚠️ 重构后 rag 包名可能变了——如果启动报找不到别名，改成实际的 entity 包
  type-aliases-package: org.example.rag.entity

# ============================================================
# 日志
# ============================================================
logging:
  level:
    # ⚠️ TRACE 级日志会在生产环境输出海量内容——建议改成 DEBUG 或 WARN
    org.springframework.web.client: TRACE
    org.springframework.web.client.DefaultRestClient: TRACE
    org.springframework.http.client: TRACE
    org.springframework.ai.openai: DEBUG
    org.mybatis: DEBUG
    org.mybatis.spring: DEBUG
    org.apache.ibatis: DEBUG

# ============================================================
# 应用配置
# ============================================================
app:
  # ========== RAG 摄取与检索 ==========
  rag:
    ingest:
      file-storage-dir: D:/DevelopmentTool/qdrant/rag-files/
      listen-files-dir: D:/download/testVectorData
      scan-interval-ms: 3000000
      incremental-enabled: true
    retrieval:
      top-k: 2
      similarity-threshold: 0.5
      rrf-k: 60
      recall-multiplier: 2
      rerank:
        api-url: http://localhost:8081/rerank
        timeout-seconds: 8
        min-score: 0.3
      fusion-strategy: weighted
      vector-weight: 0.7
      keyword-weight: 0.3

  # ========== OCR ==========
  ocr:
    enabled: true
    tessdata-path: ./tessdata/
    language: chi_sim+eng
    timeout-seconds: 30
    min-text-length: 5
    page-seg-mode: 3

  # ========== 澄清判定 ==========
  clarification:
    enabled: true
    min-top-score: 0.5
    min-qualified-docs: 2

  # ========== 对话历史向量化（D50） ==========
  conversation-memory:
    enabled: true
    index-name: conversation-memory-index
    key-prefix: "conv-mem:"
    top-k: 3
    similarity-threshold: 0.75
    max-assistant-chars: 2000
    min-user-message-chars: 5
    exclude-current-conversation: true
    scan-batch-size: 500
    scan-timeout-seconds: 5
    max-conversation-ids: 1000

  # ========== 个性化检索（D51） ==========
  retrieval:
    profile:
      enabled: true

  # ========== 语义缓存 ==========
  cache:
    semantic:
      enabled: true
      index-name: semantic-cache-index
      key-prefix: "semantic-cache:"
      similarity-threshold: 0.85
      ttl-hours: 24
      max-cache-per-user: 200

  # ========== 主动推荐（D52） ==========
  recommendation:
    enabled: true
    top-k: 3
    recall-size: 9
    recent-query-count: 2
    prefix: "[RECOMMEND]"
    max-snippet-chars: 80

  # ========== 用户兴趣标签（D53） ==========
  user-interest:
    enabled: true
    inject-top-n: 5
    max-tags-per-user: 30
    ttl-days: 180
    weight-increment: 0.15
    max-weight: 1.0
    min-weight: 0.2

  # ========== 异步索引（D55） ==========
  async-index:
    enabled: true
    concurrency: 4
    queue-capacity: 500
    per-file-timeout-seconds: 300
    min-interval-ms: 200
    progress-log-interval: 10

  # ========== 会话压缩 ==========
  compaction:
    max-messages-before-compaction: 20
    keep-recent-messages: 8

  # ========== Plan-and-Execute（D57.5） ==========
  plan:
    enabled: true
    max-steps: 8
    max-description-length: 200
    total-timeout-ms: 120000
    per-step-timeout-ms: 30000
    per-step-retry: 2
    max-replans: 2
    persist-state: true
    state-ttl-hours: 24
    allowed-tools:
      - calculate
      - analyzeText
      - getOrderStatus
      - createTodo
      - listTodos
      - getJoke
      - getQuote

  # ========== 工作流引擎 ==========
  workflow:
    # 引擎级——所有工作流共用
    engine:
      enabled: true
      default-step-timeout-ms: 10000
      total-timeout-ms: 60000
      idempotency-lock-seconds: 300
      dry-run: false
      # 单节点超时覆盖——key = 节点名
      step-timeout-overrides:
        LoadOrderNode: 5000
        EscalateToHumanNode: 30000

    # 订单工作流专属
    order:
      escalate-unknown-status: true
      # 决策路由表——订单状态 → 目标节点
      routing-table:
        PENDING_PAYMENT: PaymentReminderNode
        SHIPPED: LogisticsTrackingNode
        SIGNED: SatisfactionSurveyNode
        REFUNDING: EscalateToHumanNode
        REFUNDED: EscalateToHumanNode
        UNKNOWN: EscalateToHumanNode

  # ========== 并行执行（D60） ==========
  parallel:
    enabled: true
    use-virtual-threads: true
    platform-pool-size: 16
    platform-queue-capacity: 256
    default-timeout-ms: 5000
    default-task-timeout-ms: 3000
    record-task-timing: true

  # ========== 重试（D61） ==========
  retry:
    enabled: true
    default-max-attempts: 3
    default-backoff-ms: 200
    default-backoff-multiplier: 2.0
    default-max-backoff-ms: 5000
    default-jitter: true
    override:
      order-basic:
        max-attempts: 2
        backoff-ms: 100
      logistics:
        max-attempts: 5
        backoff-ms: 500
        max-backoff-ms: 3000
      user-profile:
        max-attempts: 2
        backoff-ms: 100

  # ========== 人工介入（D62） ==========
  hitl:
    enabled: true
    default-timeout-minutes: 30
    scan-interval-ms: 60000
    default-assignee: admin
    auto-timeout-enabled: true
    timeout-fallback: REJECT
    task-history-ttl-hours: 72
    # 通知器实现——log（默认）/ 自定义
    # notifier: log
    approval-required-branches:
      - PaymentReminderNode
      - EscalateToHumanNode
    approval-required-statuses:
      - REFUNDING

  # ========== DSL（D63） ==========
  dsl:
    enabled: true
    hot-reload-enabled: false
    validate-on-load: true
    classpath-patterns:
      - classpath*:workflows/*.yaml
    scan-dirs:
      - ./workflows