# ============================================================
# 日志级别配置（公共部分）
# ============================================================
logging:
  level:
    org.springframework.web.client: TRACE
    org.springframework.ai.openai: DEBUG
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# ============================================================
# dev profile —— 本地开发
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev
app:
  log:
    home: ./logs          # 项目根/logs

# ============================================================
# prod profile —— 服务器生产
# ============================================================
---
spring:
  config:
    activate:
      on-profile: prod
app:
  log:
    home: /var/log/firstagent    # 服务器绝对路径
logging:
  level:
    # 生产环境降噪
    org.springframework.web.client: WARN
    org.springframework.ai.openai: INFO
    org.mybatis: WARN