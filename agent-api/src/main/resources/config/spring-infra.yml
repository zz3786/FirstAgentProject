# ============================================================
# Spring 基础设施配置
# ------------------------------------------------------------
# 包含：AI 模型 / 数据库 / Redis / Qdrant / MyBatis
# ============================================================

spring:

  # ========== OpenAI 自动配置裁剪 ==========
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  ai:
    openai:
      # ========== Chat 模型（DeepSeek）==========
      chat:
        base-url: https://api.deepseek.com
        # API Key 从环境变量读——不要硬编码
        api-key: ${DEEPSEEK_API_KEY}
        options:
          model: deepseek-v4-pro

      # ========== Embedding 模型（阿里云百炼）==========
      embedding:
        # 用控制台显示的专属域名（每个账号不同）
        base-url: https://llm-flmgbipyi282dygn.cn-beijing.maas.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY}
        options:
          # text-embedding-v4——阿里云最新版
          model: text-embedding-v4
          # 维度必须和后续检索的向量库对齐——改这里要重建索引
          dimensions: 1024

    # ========== Qdrant 向量库 ==========
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        # ★ 恢复标准写法：生产环境通过环境变量传入密码
        api-key: ${QDRANT__SERVICE__API_KEY:}
        collection-name: agent-rag
        initialize-schema: true     # 启动时自动创建集合
        use-tls: false              # 本地开发不用 TLS
        check-compatibility: false  # 跳过版本检查——避免某些版本误报

  # ========== MySQL 数据源 ==========
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:3306/rag?useUnicode=true&autoReconnect=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: ${MYSQL_USER:rag}
    password: ${MYSQL_PASSWORD:rag123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ========== Redis ==========
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      database: ${REDIS_DATABASE:0}
      port: ${REDIS_PORT:6379}
      # ★ D78：密码必须走环境变量——不留任何明文默认值
      password: ${REDIS_PASSWORD:}

  # ============================================================
  # RabbitMQ 连接配置（Spring Boot 标准前缀）
  # ============================================================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fap}
    password: ${RABBITMQ_PASSWORD:fap123456}
    virtual-host: ${RABBITMQ_VHOST:/fap}
    # Publisher Confirm——保证消息到达 Broker
    publisher-confirm-type: correlated
    publisher-returns: true
    # 自动声明拓扑——由 RabbitTopologyConfig 主动声明，这里关掉隐式声明
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: false   # 我们不用 Spring 的自动重试——靠 DLX

# ========== MyBatis ==========
mybatis:
  # XML mapper 文件位置——支持多模块
  mapper-locations: classpath*:mapper/**/*.xml