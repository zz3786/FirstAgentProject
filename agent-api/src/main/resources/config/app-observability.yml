# ============================================================
# 可观测性配置（D77：Micrometer Tracing + Zipkin）
# ------------------------------------------------------------
# 与 app-logging.yml 分离：
#   - app-logging.yml     → 日志级别
#   - app-observability.yml → 链路追踪
# ============================================================

management:
  # ---------- Tracing 采样率 ----------
  tracing:
    sampling:
      probability: 0.1 # 生产默认 10% 采样——dev profile 覆盖为 1.0


  # ---------- Zipkin 上报端点 ----------
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}

  # ---------- Actuator 端点 ----------
  endpoints:
    web:
      exposure:
        # 把 metrics / health / refresh 都暴露出来
        include: health,metrics,refresh

  # ---------- 指标标签 ----------
  metrics:
    tags:
      # 所有指标带上 application 标签——多实例部署时区分来源
      application: ${spring.application.name:agent-api}
    distribution:
      # 打开 HTTP / LLM 调用的延迟直方图（P50/P95/P99）
      percentiles-histogram:
        http.server.requests: true
        spring.ai.chat.client: true


spring:
  reactor:
    context-propagation: auto   # ★ 让 Reactor 自动传播 MDC / TraceContext

# ---------- dev profile 覆盖采样率 ----------
---
spring:
  config:
    activate:
      on-profile: dev
management:
  tracing:
    sampling:
      # 用 dev profile 覆盖
      probability: 1.0    # ★ dev 100% 采样——调试用


# ============================================================
# D77：自定义埋点开关
# ------------------------------------------------------------
# 与 management.tracing.* 的区别：
#   management.tracing.*   → 全局采样率（记不记 trace）
#   app.observability.*    → 具体埋点开关（哪类操作要不要生成 Span）
# ============================================================
app:
  observability:
    tracing:
      # 总开关——关闭后所有自定义埋点跳过（仍保留 Spring 自动的 HTTP/JDBC 埋点）
      enabled: true

      # 是否追踪 ChatClient 调用
      trace-chat-client: true

      # 是否追踪工具调用
      trace-tool-calls: true

      # 工具入参在 Span tag 里的最大长度
      # 0 = 只记长度不记内容（生产推荐）
      # >0 = 记录前 N 个字符（调试用——注意隐私）
      max-input-tag-length: 0

      # 是否记录工具调用成功/失败 tag
      record-tool-outcome: true

# ============================================================
# D79：接口文档配置（默认开启）
# ============================================================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # 访问路径：http://localhost:8080/fap/swagger-ui/index.html
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: org.example.api.controller

# ============================================================
# prod profile 下关闭接口文档，防止生产环境暴露接口
# ============================================================
---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false